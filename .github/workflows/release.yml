name: Release

on:
  push:
    branches:
      - codex/v2.3.0-release
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve package version
        shell: pwsh
        run: |
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $Version = $env:VERSION
          if ($env:GITHUB_REF_NAME -ne "v$Version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $Version"
          }

      - name: Install test dependencies
        run: python -m pip install "setuptools>=68" wheel -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest --junitxml=pytest-results.xml
          $TestExitCode = $LASTEXITCODE
          "## Windows pytest" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Exit code: $TestExitCode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (Test-Path .\pytest-results.xml) {
            $FailedTests = Select-Xml -Path .\pytest-results.xml -XPath "//testcase[failure or error]"
            foreach ($Failure in $FailedTests) {
              $Name = "$($Failure.Node.classname)::$($Failure.Node.name)"
              "- $Name" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Write-Output "::error title=Windows pytest failed::$Name"
            }
          }
          exit $TestExitCode

      - name: Run Ruff
        run: python -m ruff check scripts/

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Check patch formatting
        run: git diff --check

      - name: Build verified Windows assets
        shell: pwsh
        run: |
          $PythonExe = (Get-Command python.exe).Source
          .\packaging\windows\build-assets.ps1 `
            -PythonExe $PythonExe `
            -ReleaseVersion $env:VERSION `
            -OutputRoot .\release

      - name: Assemble release downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:VERSION
          $ReleaseRoot = Join-Path $PWD "release"
          $SourceZip = Join-Path $ReleaseRoot "nuoyan-skill-v2-$Version-source.zip"
          $StandardZip = Join-Path $ReleaseRoot "nuoyan-windows-standard-assets-$Version.zip"
          $BundleStage = Join-Path $ReleaseRoot "offline-installer-stage"
          $CombinedZip = Join-Path $ReleaseRoot "nuoyan-windows-offline-installer-$Version.zip"
          $Prompt = Join-Path $ReleaseRoot "WINDOWS_VALIDATION_PROMPT.md"

          git archive --format=zip --prefix="nuoyan-skill-v2/" --output=$SourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }

          if (Test-Path $BundleStage) { Remove-Item $BundleStage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $BundleStage | Out-Null
          Expand-Archive -LiteralPath $SourceZip -DestinationPath $BundleStage -Force
          Copy-Item -LiteralPath $StandardZip -Destination $BundleStage
          Copy-Item -LiteralPath .\packaging\windows\install-offline.cmd `
            -Destination (Join-Path $BundleStage "INSTALL_NUOYAN.cmd")
          Copy-Item -LiteralPath .\packaging\windows\README_FIRST.md `
            -Destination (Join-Path $BundleStage "README_FIRST.md")
          Copy-Item -LiteralPath .\docs\windows-installation-validation-prompt.md `
            -Destination $Prompt

          if (Test-Path $CombinedZip) { Remove-Item $CombinedZip -Force }
          Compress-Archive -Path (Join-Path $BundleStage "*") -DestinationPath $CombinedZip

          $ReleaseFiles = @($CombinedZip, $StandardZip, $SourceZip, $Prompt)
          $Checksums = foreach ($File in $ReleaseFiles) {
            $Hash = (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $([System.IO.Path]::GetFileName($File))"
          }
          $Checksums | Set-Content -LiteralPath (Join-Path $ReleaseRoot "SHA256SUMS.txt") -Encoding utf8

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = $env:GITHUB_REF_NAME
          $Title = "诺研 Skill v$env:VERSION"
          $Notes = ".\docs\releases\v$env:VERSION.md"
          gh release view $Tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --repo $env:GITHUB_REPOSITORY --title $Title `
              --notes-file $Notes
          } else {
            gh release create $Tag --repo $env:GITHUB_REPOSITORY --title $Title `
              --notes-file $Notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Assets = @(
            ".\release\nuoyan-windows-offline-installer-$env:VERSION.zip",
            ".\release\nuoyan-windows-standard-assets-$env:VERSION.zip",
            ".\release\nuoyan-skill-v2-$env:VERSION-source.zip",
            ".\release\WINDOWS_VALIDATION_PROMPT.md",
            ".\release\SHA256SUMS.txt"
          )
          gh release upload $Tag $Assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
